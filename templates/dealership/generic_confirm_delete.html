{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <p>Вы уверены, что хотите удалить: <strong>{{ object }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="button-danger">Удалить</button>
    </form>
</div>
{% endblock %}
