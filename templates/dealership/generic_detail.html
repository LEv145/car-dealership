{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ title }}</h2>

    <table class="detail-table">
        <tbody>
            {% for label, value in field_rows %}
                <tr>
                    <td>{{ label }}</td>
                    <td>{{ value }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <div class="actions" style="margin-top: 16px;">
        <a href="{{ update_url }}">Редактировать</a>
        <a href="{{ delete_url }}" class="button-danger">Удалить</a>
    </div>
</div>
{% endblock %}
